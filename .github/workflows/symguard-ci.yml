name: SymGuard CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run regression test suite (pytest)
        run: |
          pytest -v

      - name: Generate report artifacts (JSON & SARIF)
        if: always()
        run: |
          mkdir -p reports
          python analyzer.py examples/command_injection.py --format json --output reports/command_injection.json
          python analyzer.py examples/command_injection.py --format sarif --output reports/command_injection.sarif
          python analyzer.py examples/out_of_bounds.py --format json --output reports/out_of_bounds.json
          python analyzer.py examples/out_of_bounds.py --format sarif --output reports/out_of_bounds.sarif

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symguard-reports-py${{ matrix.python-version }}
          path: reports/
