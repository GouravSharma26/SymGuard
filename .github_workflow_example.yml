name: Vulnerability Analysis

# Runs the Z3-backed static analyzer on every push/PR and fails the build
# if any vulnerability is PROVEN reachable (not just pattern-matched).
# The JSON report is uploaded as a build artifact either way, so a proven
# safe result or an UNKNOWN one is still visible for review.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install z3-solver

      - name: Run vulnerability analyzer
        # --fail-on-vulnerable makes this step (and therefore the job)
        # exit non-zero if Z3 proves any sink reachable -- that's the gate.
        run: |
          python3 analyzer.py app.py \
            --format json \
            --output findings.json \
            --fail-on-vulnerable

      - name: Upload findings report
        if: always()   # keep the report even if the step above failed the build
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-findings
          path: findings.json
