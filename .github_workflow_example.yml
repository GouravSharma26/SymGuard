# Example GitHub Actions Workflow Template for downstream projects
# Copy this file to .github/workflows/symguard.yml in your own repository
# to run SymGuard on pull requests and fail the build if vulnerabilities are proven.
# Replace `target_script.py` below with your entrypoint file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install z3-solver

      - name: Run vulnerability analyzer
        # --fail-on-vulnerable makes this step (and therefore the job)
        # exit non-zero if Z3 proves any sink reachable -- that's the gate.
        run: |
          python3 analyzer.py target_script.py \
            --format json \
            --output findings.json \
            --fail-on-vulnerable

      - name: Upload findings report
        if: always()   # keep the report even if the step above failed the build
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-findings
          path: findings.json
